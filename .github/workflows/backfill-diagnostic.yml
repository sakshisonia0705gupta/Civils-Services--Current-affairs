

name: Historical Backfill Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Run historical PIB archive collection
        run: python scripts/backfill_news.py

      - name: Save diagnostic reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backfill_preview.json data/backfill_report.json
          git diff --cached --quiet || git commit -m "Run historical PIB archive backfill"
          git push
  
